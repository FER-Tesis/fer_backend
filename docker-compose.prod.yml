services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - auth-service
      - camera-service
      - central-service
      - alert-service

  user-service:
    build: ./user-service
    env_file:
      - ./user-service/.env

  auth-service:
    build: ./auth-service
    env_file:
      - ./auth-service/.env

  camera-service:
    build: ./camera-service
    env_file:
      - ./camera-service/.env

  central-service:
    build: ./central-service
    env_file:
      - ./central-service/.env

  alert-service:
    build: ./alert-service
    env_file:
      - ./alert-service/.env

  redis:
    image: redis:7

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data

volumes:
  minio_data: