services:
  user-service:
    build: ./user-service
    ports:
      - "8001:8000"
    volumes:
      - ./user-service:/app
    env_file:
      - ./user-service/.env

  auth-service:
    build: ./auth-service
    ports:
      - "8002:8000"
    volumes:
      - ./auth-service:/app
    env_file:
      - ./auth-service/.env

  camera-service:
    build: ./camera-service
    ports:
      - "8003:8000"
    volumes:
      - ./camera-service:/app
    env_file:
      - ./camera-service/.env

  central-service:
    build: ./central-service
    ports:
      - "8004:8000"
    volumes:
      - ./central-service:/app
    env_file:
      - ./central-service/.env

  alert-service:
    build: ./alert-service
    ports:
      - "8005:8000"
    volumes:
      - ./alert-service:/app
    env_file:
      - ./alert-service/.env

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data

volumes:
  minio_data: